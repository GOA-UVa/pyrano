<VirtualHost *:443>
        ServerName goa-models.opt.cie.uva.es
        ServerAdmin webmaster@localhost
        DocumentRoot /var/www/html

        ErrorLog ${APACHE_LOG_DIR}/error.log

        CustomLog ${APACHE_LOG_DIR}/access.log combined

        SSLEngine on
        SSLCertificateFile /opt/ssl/fullchain.pem
        SSLCertificateKeyFile /opt/ssl/goa_models.key

        ProxyPass "/pyrano" "http://127.0.0.1:8001"
        ProxyPassReverse "/pyrano" "http://127.0.0.1:8001"
        ProxyPreserveHost On

</VirtualHost>
